name: Build & release apps

# Har safar main'ga frontend o'zgarishi bilan push qilinganda: APK (Android)
# va exe (Windows) ikkalasi ham quriladi, so'ng backend orqali ochiq
# (login talab qilmaydigan) URL'ga yuklanadi va Telegram bot orqali
# dasturchidan boshqa BARCHA foydalanuvchiga "yangi versiya chiqdi"
# xabari avtomatik yuboriladi — aniq foydalanuvchi talabi bo'yicha, har
# push'da (qo'lda ishga tushirish shart emas).
#
# Buning uchun "DEPLOY_BROADCAST_SECRET" nomli Actions secret shu repo'da
# o'rnatilgan bo'lishi kerak (Settings > Secrets and variables > Actions),
# qiymati Render'dagi bir xil nomdagi environment variable bilan BIR XIL.
# Secret yo'q/bo'sh bo'lsa — broadcast qadami xatosiz o'tkazib yuboriladi
# (build'ning o'zi buzilmaydi), faqat xabar yuborilmaydi.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versiya nomi (bo'sh qoldirsa avtomatik hosil qilinadi)"
        required: false
        type: string
      notes:
        description: "Yangilanish haqida qisqa izoh (ixtiyoriy)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-build.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install frontend deps
        run: npm ci

      - name: Build web bundle (embeds VITE_API_URL from .env.production)
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: qurilisherp-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # Rust/Cargo bog'liqliklarini keshlash — bularsiz HAR bir push'da
      # Tauri yuzlab crate'ni noldan yuklab kompilyatsiya qilardi (bu
      # aynan Windows build'ning eng sekin qismi, ~10-15 daqiqa). Keshlansa,
      # Cargo.lock o'zgarmagan keyingi build'larda faqat o'zgargan
      # fayllar qayta kompilyatsiya qilinadi — sezilarli tezroq. Rasmiy
      # actions/cache — Tauri'ga xos uchinchi tomon action emas.
      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend deps
        run: npm ci

      # Xuddi mahalliy "npm run build:windows" bilan bir xil — mashinada
      # qo'lda qilingan build bilan aynan bir xil natija, boshqa
      # qo'shimcha, sinalmagan Action ishlatilmaydi.
      - name: Build web bundle + Tauri (Windows exe/msi)
        run: npm run build:windows

      - uses: actions/upload-artifact@v4
        with:
          name: qurilisherp-windows-exe
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

  # APK va exe ikkalasi ham tayyor bo'lgach — backend'ga yuklab, botdan
  # broadcast qiladi. Push'da HAR DOIM ishga tushadi (aniq talab bo'yicha);
  # qo'lda ishga tushirilsa ham xuddi shunday, faqat versiya/izoh qo'lda
  # kiritilgan bo'lishi mumkin.
  broadcast:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: always() && needs.build-android.result == 'success' && needs.build-windows.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qurilisherp-debug-apk
          path: artifacts/apk

      - uses: actions/download-artifact@v4
        with:
          name: qurilisherp-windows-exe
          path: artifacts/exe

      - name: Upload APK + exe, notify all users via bot
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_BROADCAST_SECRET }}
          BACKEND_URL: https://qurilisherp-backend.onrender.com
          VERSION_INPUT: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -e
          if [ -z "$DEPLOY_SECRET" ]; then
            echo "::warning::DEPLOY_BROADCAST_SECRET o'rnatilmagan (Settings > Secrets and variables > Actions) — build tayyor, lekin bildirishnoma YUBORILMAYDI."
            exit 0
          fi

          VERSION="$VERSION_INPUT"
          if [ -z "$VERSION" ]; then
            VERSION="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          fi

          APK_PATH=$(find artifacts/apk -iname "*.apk" | head -1)
          EXE_PATH=$(find artifacts/exe -iname "*setup*.exe" -o -iname "*.exe" | head -1)

          upload() {
            local path="$1"
            curl -sf -X POST "$BACKEND_URL/api/deploy/upload-artifact" \
              -H "X-Deploy-Secret: $DEPLOY_SECRET" \
              -F "file=@${path}" \
            | node -e "process.stdin.once('data', d => console.log(JSON.parse(d).url))"
          }

          APK_URL=""
          EXE_URL=""
          if [ -n "$APK_PATH" ]; then APK_URL=$(upload "$APK_PATH"); echo "APK: $APK_URL"; fi
          if [ -n "$EXE_PATH" ]; then EXE_URL=$(upload "$EXE_PATH"); echo "EXE: $EXE_URL"; fi

          if [ -z "$APK_URL" ] && [ -z "$EXE_URL" ]; then
            echo "::error::Na APK, na exe yuklanmadi — broadcast o'tkazib yuborildi."
            exit 1
          fi

          BODY=$(jq -n --arg version "$VERSION" --arg apkUrl "$APK_URL" --arg exeUrl "$EXE_URL" --arg notes "$NOTES" \
            '{version: $version} + (if $apkUrl != "" then {apkUrl: $apkUrl} else {} end) + (if $exeUrl != "" then {exeUrl: $exeUrl} else {} end) + (if $notes != "" then {notes: $notes} else {} end)')
          RESULT=$(curl -sf -X POST "$BACKEND_URL/api/deploy/broadcast-update" \
            -H "X-Deploy-Secret: $DEPLOY_SECRET" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          echo "Broadcast natijasi: $RESULT"
