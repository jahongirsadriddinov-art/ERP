[package]
name = "qurilish-erp"
version = "1.0.0"
description = "Qurilish firmalari uchun ERP tizimi"
authors = ["QurilishERP"]
edition = "2021"

[lib]
name = "qurilish_erp_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "qurilish-erp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
