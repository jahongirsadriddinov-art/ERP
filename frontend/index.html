
  <!DOCTYPE html>
  <html lang="uz" translate="no">
    <head>

      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

      <!-- Tema-chaqnashini (FOUC) oldini olish -->
      <script>
        (function () {
          try {
            var mode = localStorage.getItem('erp_themeMode');
            var isDark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
              document.documentElement.classList.add('dark');
              document.documentElement.style.colorScheme = 'dark';
            }
          } catch (e) {}
        })();
      </script>
      <!-- XATO TUZATILDI: bular avval "navy" (standart) temaning fon
           ranglariga qattiq kodlangan edi — standart rang endi "amber"
           ("Oltin rang") ga o'zgartirilgani uchun (App.tsx'dagi colorTheme),
           bu yerdagi qiymatlar ham React yuklanmasdan OLDINGI (ilk bo'yash)
           lahzada rang "chaqnab" (flash) ko'rinmasligi uchun mos ravishda
           yangilandi. -->
      <style>
        html { background: #FFFBEB; }
        html.dark { background: #15100A; }
        body { background: inherit; }
      </style>

      <!-- PWA -->
      <link rel="manifest" href="/manifest.json" />
      <meta name="theme-color" content="#B45309" media="(prefers-color-scheme: light)" />
      <meta name="theme-color" content="#15100A" media="(prefers-color-scheme: dark)" />

      <!-- Apple PWA -->
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
      <meta name="apple-mobile-web-app-title" content="QurilishERP" />
      <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

      <!-- Favicon — Google qidiruv natijalarida (va eski brauzerlarda) SVG'ni
           ishonchli ko'rsatavermaydi, shuning uchun .ico/.png variantlar ham
           qo'shildi (SVG zamonaviy brauzer tab-iконkasi uchun ustuvor bo'lib qoladi). -->
      <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
      <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
      <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
      <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
      <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
      <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
      <link rel="shortcut icon" href="/favicon.ico" />

      <!-- SEO -->
      <title>QurilishERP — Qurilish firmalari uchun boshqaruv tizimi</title>
      <meta name="description" content="Qurilish firmasini raqamlashtirish (elektronlashtirish) uchun zamonaviy ERP tizimi. Loyihalar, smeta, materiallar hisobi, moliya, xodimlar davomati va GPS nazorati, real-time chat, AI yordamchi va Telegram bot integratsiyasi — bittа tizimda." />
      <meta name="keywords" content="qurilish ERP, firmani raqamlashtirish, firmani elektronlashtirish, qurilish boshqaruvi, qurilish avtomatlashtirish, loyiha boshqaruvi, smeta, materiallar hisobi, xodimlar boshqaruvi, xodimlar davomati, ishchilar yo'qlamasi, GPS nazorat, qurilish moliyasi, pudratchi tizimi" />
      <meta name="robots" content="index, follow" />
      <meta name="author" content="QurilishERP" />
      <link rel="canonical" href="https://www.erp-firma.uz/" />
      <!-- Hozircha sayt bitta (o'zbek) tilda; hreflang'ning o'zi "x-default"
           bilan bir tilli saytlarda ham zarar keltirmaydi — kelajakda /ru
           sahifa qo'shilganda shu yerga "ru" varianti ham qo'shiladi. -->
      <link rel="alternate" hreflang="uz" href="https://www.erp-firma.uz/" />
      <link rel="alternate" hreflang="x-default" href="https://www.erp-firma.uz/" />

      <!-- Open Graph -->
      <meta property="og:type" content="website" />
      <meta property="og:site_name" content="QurilishERP" />
      <meta property="og:title" content="QurilishERP — Qurilish firmalari uchun boshqaruv tizimi" />
      <meta property="og:description" content="Loyihalar, materiallar, moliya va xodimlarni bir joyda boshqaring. Real-time chat, AI yordamchi, Telegram integratsiyasi." />
      <meta property="og:locale" content="uz_UZ" />
      <meta property="og:url" content="https://www.erp-firma.uz/" />
      <meta property="og:image" content="https://www.erp-firma.uz/og-image.png" />
      <meta property="og:image:width" content="1200" />
      <meta property="og:image:height" content="630" />

      <!-- Twitter Card -->
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:title" content="QurilishERP — Qurilish firmalari uchun boshqaruv tizimi" />
      <meta name="twitter:description" content="Loyihalar, materiallar, moliya va xodimlarni bir joyda boshqaring." />

      <!-- Structured Data -->
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "QurilishERP",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web, Android, iOS",
        "description": "Qurilish firmalari uchun ERP tizimi — loyihalar, materiallar, moliya, xodimlar boshqaruvi.",
        "url": "https://www.erp-firma.uz/",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "UZS",
          "description": "Birinchi oy bepul"
        },
        "inLanguage": ["uz", "ru"],
        "featureList": [
          "Loyiha boshqaruvi",
          "Smeta tahlili",
          "Material tracking",
          "Moliya hisobi",
          "Real-time chat",
          "AI yordamchi",
          "Telegram integratsiyasi"
        ]
      }
      </script>
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "QurilishERP",
        "url": "https://www.erp-firma.uz/",

      }

      <!-- Fonts — preconnect + async (render-blocking emas) -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'" />
      <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" /></noscript>

      <style>
        html, body { height: 100%; margin: 0; }
        #root { height: 100%; }
        #initial-loader {
          height: 100%; display: flex; align-items: center; justify-content: center;
          flex-direction: column; gap: 16px;
        }
        #initial-loader .logo-wrap {
          width: 56px; height: 56px; border-radius: 18px;
          background: linear-gradient(135deg, #B45309, #B16105);
          display: flex; align-items: center; justify-content: center;
          box-shadow: 0 8px 32px rgba(180,83,9,0.35);
          animation: loader-pop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
        }
        #initial-loader .spinner {
          width: 28px; height: 28px; border-radius: 50%;
          border: 2.5px solid rgba(255,255,255,0.3);
          border-top-color: #fff;
          animation: initial-spin 0.65s linear infinite;
        }
        html.dark #initial-loader .logo-wrap {
          background: linear-gradient(135deg, #B87A1C, #B45309);
          box-shadow: 0 8px 32px rgba(184,122,28,0.35);
        }
        @keyframes initial-spin { to { transform: rotate(360deg); } }
        @keyframes loader-pop {
          from { opacity: 0; transform: scale(0.75); }
          to   { opacity: 1; transform: scale(1); }
        }
      </style>

    </head>

    <body>

      <div id="root"><div id="initial-loader"><div class="logo-wrap"><div class="spinner"></div></div></div></div>
      <script type="module" src="/src/main.tsx"></script>

    </body>
  </html>
