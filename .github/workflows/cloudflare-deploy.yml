# Saytni Cloudflare'ga chiqarish (owner 2026-10-27: hosting Vercel'dan Cloudflare'ga ko'chdi).
# Har bir main'ga push'da frontend yig'iladi va Workers Assets orqali chiqariladi.
# Kerak: GitHub → Settings → Secrets → Actions da CLOUDFLARE_API_TOKEN va CLOUDFLARE_ACCOUNT_ID.
name: Cloudflare deploy

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/cloudflare-deploy.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: O'rnatish
        working-directory: frontend
        run: npm ci

      - name: Yig'ish
        working-directory: frontend
        run: npm run build

      - name: Chiqarish
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy
