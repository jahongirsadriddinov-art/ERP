name: tgcall-worker tests

# Telegram qo'ng'iroq worker'i (Python) — soxta Telegram bilan birlik testlari.
# Jonli qo'ng'iroq testi (tests/test_live_call.py, @pytest.mark.live) bu yerda HECH QACHON ishlamaydi:
# LIVE_TG=1 berilmaydi — u "NOT RUN" (skipped) bo'lib qoladi.
on:
  push:
    branches: [main]
    paths:
      - 'tgcall-worker/**'
      - '.github/workflows/tgcall-worker-tests.yml'
  pull_request:
    paths:
      - 'tgcall-worker/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tgcall-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tgcall-worker/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
