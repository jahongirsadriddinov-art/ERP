name: Frontend build check

# Frontend'da HECH QANDAY CI tekshiruvi yo'q edi — na test, na hatto oddiy
# "build muvaffaqiyatli o'tadimi" tekshiruvi (mavjud android-build.yml
# butun APK/EXE ni qurishga soatlab vaqt sarflaydi, tez fikr-mulohaza
# bermaydi). Bu workflow har bir PR/push'da frontend'ning tez (bir necha
# soniyalik) `vite build`'i orqali sintaksis/import xatolarini DARHOL
# ushlaydi — to'liq native ilova qurilishini kutmasdan.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build-check.yml'
  pull_request:
    paths:
      - 'frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Brauzer robot: tayyor saytni telefon va kompyuter o'lchamida ochib tekshiradi
      # (yuklashda qotmaslik, JS xatosi yo'qligi, sahifa yon tomonga siljimasligi, ochiq sahifalar)
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7
