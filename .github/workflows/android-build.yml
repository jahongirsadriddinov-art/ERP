name: Build & release apps

# Har safar main'ga frontend o'zgarishi bilan push qilinganda: APK (Android)
# va exe (Windows) ikkalasi ham quriladi, so'ng backend orqali ochiq
# (login talab qilmaydigan) URL'ga yuklanadi va Telegram bot orqali
# dasturchidan boshqa BARCHA foydalanuvchiga "yangi versiya chiqdi"
# xabari avtomatik yuboriladi — aniq foydalanuvchi talabi bo'yicha, har
# push'da (qo'lda ishga tushirish shart emas).
#
# Buning uchun "DEPLOY_BROADCAST_SECRET" nomli Actions secret shu repo'da
# o'rnatilgan bo'lishi kerak (Settings > Secrets and variables > Actions),
# qiymati Render'dagi bir xil nomdagi environment variable bilan BIR XIL.
# Secret yo'q/bo'sh bo'lsa — broadcast qadami xatosiz o'tkazib yuboriladi
# (build'ning o'zi buzilmaydi), faqat xabar yuborilmaydi.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versiya nomi (bo'sh qoldirsa avtomatik hosil qilinadi)"
        required: false
        type: string
      notes:
        description: "Yangilanish haqida qisqa izoh (ixtiyoriy)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-build.yml'

# Tez ketma-ket bir necha push bo'lsa (masalan tez orada bir necha marta
# tuzatish kiritilsa) — har biri o'zining to'liq Android+Windows build'ini
# ishga tushirib, HAMMASI alohida-alohida botga "yangi versiya" deb xabar
# yuborardi (bir nechta deyarli bir xil, ketma-ket xabar — chalkash va
# behuda CI vaqti). Endi yangi push eskisini BEKOR qiladi — faqat ENG
# OXIRGI kod uchun build tugab, botga bitta xabar boradi.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Bitta versiya nomi — ilovaga kiritiladi (yangilanish tekshiruvi uchun) VA botga
  # yuboriladigan xabarda ishlatiladi.
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          V="$VERSION_INPUT"
          if [ -z "$V" ]; then V="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

  build-android:
    needs: meta
    runs-on: ubuntu-latest
    env:
      VITE_APP_VERSION: ${{ needs.meta.outputs.version }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest'da Android SDK oldindan o'rnatilgan (ANDROID_HOME).
      # setup-android@v3 qadami takroriy ravishda muvaffaqiyatsiz bo'layotgan
      # edi — uni olib tashlab, faqat litsenziyalarni qabul qilamiz, kerakli
      # platforma/build-tools'ni Gradle o'zi yuklaydi.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install frontend deps
        run: npm ci

      # Maxfiy imzo kaliti (GitHub secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Yo'q bo'lsa repo'dagi zaxira debug kalit ishlatiladi.
      - name: Restore Android signing key (if secrets set)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "Maxfiy imzo kaliti ishlatilmoqda"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 o'rnatilmagan — ochiq zaxira debug kalit ishlatilmoqda (xavfsiz emas)."
          fi

      - name: Build web bundle (embeds VITE_API_URL from .env.production)
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon -PappVersionCode=$((1000 + ${{ github.run_number }})) -PappVersionName=1.2.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: qurilisherp-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  build-windows:
    needs: meta
    runs-on: windows-latest
    env:
      VITE_APP_VERSION: ${{ needs.meta.outputs.version }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # Rust/Cargo bog'liqliklarini keshlash — bularsiz HAR bir push'da
      # Tauri yuzlab crate'ni noldan yuklab kompilyatsiya qilardi (bu
      # aynan Windows build'ning eng sekin qismi, ~10-15 daqiqa). Keshlansa,
      # Cargo.lock o'zgarmagan keyingi build'larda faqat o'zgargan
      # fayllar qayta kompilyatsiya qilinadi — sezilarli tezroq. Rasmiy
      # actions/cache — Tauri'ga xos uchinchi tomon action emas.
      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend deps
        run: npm ci

      # Har build o'z versiyasiga ega bo'lsin — o'rnatuvchi (NSIS/MSI) eski o'rnatilgan
      # nusxani yangi deb tanib, ustiga yozadi.
      # MUHIM: src-tauri/target keshlanadi — eski build'larning o'rnatuvchilari (bundle/nsis/*.exe)
      # ham keshdan qaytib kelardi va keyingi qadam ulardan ESKISINI yuklab yuborardi (ilova
      # "yangilanmasdi"). Har buildda eski o'rnatuvchilar o'chiriladi.
      - name: Remove stale installers from cache
        shell: bash
        run: rm -rf src-tauri/target/release/bundle

      - name: Set unique app version
        shell: bash
        run: |
          sed -i 's/"version": "1.2.0"/"version": "1.2.${{ github.run_number }}"/' src-tauri/tauri.conf.json
          grep -n '"version"' src-tauri/tauri.conf.json

      # Xuddi mahalliy "npm run build:windows" bilan bir xil — mashinada
      # qo'lda qilingan build bilan aynan bir xil natija, boshqa
      # qo'shimcha, sinalmagan Action ishlatilmaydi.
      - name: Build web bundle + Tauri (Windows exe/msi)
        run: npm run build:windows

      - uses: actions/upload-artifact@v4
        with:
          name: qurilisherp-windows-exe
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

  build-macos:
    needs: meta
    runs-on: macos-latest
    env:
      VITE_APP_VERSION: ${{ needs.meta.outputs.version }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Intel va Apple Silicon ikkalasida ham ochiladigan "universal" .dmg
      # uchun ikki Rust target ham kerak (owner 2026-11-06: "macos ham
      # chiqsin, kim ishlatsa ham ochilsin").
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend deps
        run: npm ci

      - name: Remove stale installers from cache
        run: rm -rf src-tauri/target/*/release/bundle src-tauri/target/release/bundle

      - name: Set unique app version
        run: |
          sed -i '' 's/"version": "1.2.0"/"version": "1.2.${{ github.run_number }}"/' src-tauri/tauri.conf.json
          grep -n '"version"' src-tauri/tauri.conf.json

      # Apple Developer ID yo'q — imzolanmagan .dmg (mahalliy qo'lda build
      # bilan bir xil). Ochganda Gatekeeper "noma'lum dasturchi" deb
      # ogohlantiradi — foydalanuvchi "ctrl+bos > Open" bilan davom etadi.
      - name: Build web bundle + Tauri (macOS universal dmg)
        run: npm run build:mac -- --target universal-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: qurilisherp-macos-dmg
          path: frontend/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 30

  # Android, Windows va macOS endi MUSTAQIL chiqariladi — biri muvaffaqiyatsiz
  # bo'lsa (masalan Windows/NSIS), qolganlari baribir backend'ga yuklanadi
  # va botdan xabar ketadi (owner 2026-11-06: "har bir qurilma turi alohida
  # chiqsin, bittasi ishlamasa boshqasiga tegmasin").
  broadcast-android:
    needs: [meta, build-android]
    runs-on: ubuntu-latest
    if: always() && needs.build-android.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qurilisherp-debug-apk
          path: artifacts/apk

      - name: Upload APK, notify all users via bot
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_BROADCAST_SECRET }}
          BACKEND_URL: https://erpfirma-backend.up.railway.app
          VERSION_INPUT: ${{ needs.meta.outputs.version }}
          NOTES: ${{ inputs.notes }}
          KIND: apk
          FIELD: apkUrl
        run: |
          APK_PATH=$(find artifacts/apk -iname "*.apk" | head -1)
          bash .github/scripts/publish-build.sh "$APK_PATH"

  broadcast-windows:
    needs: [meta, build-windows]
    runs-on: ubuntu-latest
    if: always() && needs.build-windows.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qurilisherp-windows-exe
          path: artifacts/exe

      - name: Upload exe, notify all users via bot
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_BROADCAST_SECRET }}
          BACKEND_URL: https://erpfirma-backend.up.railway.app
          VERSION_INPUT: ${{ needs.meta.outputs.version }}
          NOTES: ${{ inputs.notes }}
          KIND: exe
          FIELD: exeUrl
        run: |
          EXE_PATH=$(ls -t $(find artifacts/exe -iname "*setup*.exe") 2>/dev/null | head -1)
          bash .github/scripts/publish-build.sh "$EXE_PATH"

  broadcast-macos:
    needs: [meta, build-macos]
    runs-on: ubuntu-latest
    if: always() && needs.build-macos.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qurilisherp-macos-dmg
          path: artifacts/dmg

      - name: Upload dmg, notify all users via bot
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_BROADCAST_SECRET }}
          BACKEND_URL: https://erpfirma-backend.up.railway.app
          VERSION_INPUT: ${{ needs.meta.outputs.version }}
          NOTES: ${{ inputs.notes }}
          KIND: dmg
          FIELD: dmgUrl
        run: |
          DMG_PATH=$(find artifacts/dmg -iname "*.dmg" | head -1)
          bash .github/scripts/publish-build.sh "$DMG_PATH"

  # QOROVUL (owner 2026-10-30, kengaytirildi 2026-11-06): har bir qurilma
  # turi endi mustaqil — shuning uchun BIR platforma QIZIL bo'lsa ham
  # ikkinchisi chiqadi. Bu job faqat "qurildi-yu, lekin reliz chiqmadi"
  # holatini ko'rsatadi (masalan broadcast xato bo'lsa), build'ning o'zi
  # muvaffaqiyatsiz bo'lgan platformani QAYTADAN qizil qilmaydi (allaqachon
  # o'zining build-* ishida ko'ringan).
  release-check:
    needs: [build-android, build-windows, build-macos, broadcast-android, broadcast-windows, broadcast-macos]
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    steps:
      - name: Reliz chiqqanini tekshirish
        run: |
          echo "android: build=${{ needs.build-android.result }} broadcast=${{ needs.broadcast-android.result }}"
          echo "windows: build=${{ needs.build-windows.result }} broadcast=${{ needs.broadcast-windows.result }}"
          echo "macos: build=${{ needs.build-macos.result }} broadcast=${{ needs.broadcast-macos.result }}"
          FAIL=0
          if [ "${{ needs.build-android.result }}" = "success" ] && [ "${{ needs.broadcast-android.result }}" != "success" ]; then
            echo "::error::Android quridi, lekin reliz CHIQMADI (broadcast-android: ${{ needs.broadcast-android.result }})."
            FAIL=1
          fi
          if [ "${{ needs.build-windows.result }}" = "success" ] && [ "${{ needs.broadcast-windows.result }}" != "success" ]; then
            echo "::error::Windows quridi, lekin reliz CHIQMADI (broadcast-windows: ${{ needs.broadcast-windows.result }})."
            FAIL=1
          fi
          if [ "${{ needs.build-macos.result }}" = "success" ] && [ "${{ needs.broadcast-macos.result }}" != "success" ]; then
            echo "::error::macOS quridi, lekin reliz CHIQMADI (broadcast-macos: ${{ needs.broadcast-macos.result }})."
            FAIL=1
          fi
          if [ "$FAIL" = "1" ]; then
            echo "::error::Ilova (kamida bitta qurilma turida) eski qoladi — ishni qayta ishga tushiring (Re-run jobs)."
            exit 1
          fi
          echo "Reliz chiqdi (yoki chiqaradigan narsa yo'q edi)."
